# The portable checks on every push and pull request: the test suite, the portable golden masters, the linters and
# the desktop build. A GitHub runner has no game data (data/kb.db, data/glide.db, data/gamedata) and no WoW, so the
# tests that need them print "SKIP: <reason>" and exit 77 (tests/run_all.py lists them apart; they don't fail the
# run), and only the golden tier that needs nothing but the repository runs (golden.py check --portable).
# release.yml runs this same workflow before it builds a release.
#
# No model API keys here, ever: the coach runs offline in tests (the keys are blanked below as well).
name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  GOOGLE_API_KEY: ""
  OPENROUTER_API_KEY: ""
  PYTHONIOENCODING: utf-8
  # luacheck as the release's Windows executable, checked against this SHA-256 (download it once and Get-FileHash
  # it to move to another release)
  LUACHECK_URL: https://github.com/lunarmodules/luacheck/releases/download/v1.2.0/luacheck.exe
  LUACHECK_SHA256: 0f1c69c4d09f1ebb4d8df14c215e4553e2e639bd4cb7bf3c639b0daa6198317b

jobs:
  test:
    runs-on: windows-latest
    # A newer push to the same branch replaces a CI run in progress. Called from release.yml, github.workflow is
    # the release's name: its own group, never cancelled (a release must not lose its test run to a CI run).
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: ${{ github.workflow == 'CI' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # pip (~19 s: unpacking and compiling ~7,000 files, pyright's stubs and numpy) and npm ci (~10 s) don't depend
      # on each other: pip runs as a background job while npm ci runs, and its output, and its failure, come after
      - name: Python and desktop packages
        run: |
          $pip = Start-Job -WorkingDirectory $PWD {
            python -m pip install --disable-pip-version-check -r requirements-dev.txt 2>&1 | ForEach-Object { "$_" }
            if ($LASTEXITCODE) { throw "pip install failed (exit $LASTEXITCODE)" }
          }
          Push-Location desktop
          npm ci
          $npm = $LASTEXITCODE
          Pop-Location
          Write-Host "`nPython packages:"
          Receive-Job $pip -Wait -AutoRemoveJob
          if ($npm) { Write-Host "::error::npm ci failed (exit $npm)"; exit $npm }

      - name: luacheck
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "luacheck"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = Join-Path $dir "luacheck.exe"
          Invoke-WebRequest $env:LUACHECK_URL -OutFile $exe
          $got = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:LUACHECK_SHA256) { Write-Host "::error::luacheck.exe SHA-256 mismatch: $got"; exit 1 }
          $dir >> $env:GITHUB_PATH

      - name: ruff
        run: ruff check --no-cache .

      - name: luacheck addon/Glide
        run: luacheck --codes addon/Glide

      - name: Desktop build
        working-directory: desktop
        run: npm run build

      # tests/.timings.json: each test's time on this kind of runner in its last runs, so run_all.py starts the
      # longest first (without it, its hand-kept list). A new entry per run that passed (the newest restores), a few
      # KB each; a branch restores main's.
      - name: Test timings
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: tests/.timings.json
          key: test-timings-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: test-timings-${{ runner.os }}-

      # The portable golden masters run alongside the tests, as a background job (the tests' tail leaves cores idle);
      # they need node (desktop probe) and Edge (dashboard probe; windows-latest ships it in Program Files (x86)).
      # Their output follows the tests'; either failing fails the step. Safe to overlap: the probes read only the
      # repository and desktop/dist, which no test writes (Desktop build, above, already generated what the desktop
      # probe's rebuild would).
      - name: Tests and golden masters (portable tier)
        run: |
          $golden = Start-Job -WorkingDirectory $PWD {
            python tests/golden/golden.py check --portable 2>&1 | ForEach-Object { "$_" }
            if ($LASTEXITCODE) { throw "golden masters (portable tier) changed or failed (exit $LASTEXITCODE)" }
          }
          python tests/run_all.py
          $tests = $LASTEXITCODE
          Write-Host "`nGolden masters (portable tier):"
          Receive-Job $golden -Wait -AutoRemoveJob
          exit $tests
